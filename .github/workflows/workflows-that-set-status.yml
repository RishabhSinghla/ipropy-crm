# Which live workflow rules change a status, and on what trigger? Read-only.
name: Workflows that set status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rules
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          printf "BEGIN READ ONLY;\nSELECT w.name, w.is_active AS on_, w.trigger, left(w.conditions::text,140) AS conditions, t.type, left(t.config::text,160) AS config FROM ipy_workflow w JOIN ipy_workflow_task t ON t.workflow_id=w.id WHERE t.type IN ('update_field','set_field','update_record') OR t.config::text ILIKE '%%status%%' ORDER BY w.is_active DESC, w.name;\nCOMMIT;\n" | psql "$PROD_DATABASE_URL" -X -q -P pager=off 2>&1 || true
