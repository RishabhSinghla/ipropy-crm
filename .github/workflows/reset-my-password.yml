# Issue a password reset link for production, by hand.
#
# The self-service flow built earlier is the right one and needs email, which
# production does not have connected yet — so the owner of a CRM with no second
# admin can be locked out of his own system with no way back. This is that way
# back until email works, and it is deliberately the same mechanism rather than
# a second one: it writes an ordinary reset row, so the link is single-use,
# expires in an hour, and dies the moment it is used.
#
# It prints a link, never a password. Nobody but the person running it sees the
# log, and even they cannot learn the existing password from it.
name: Reset my password

on:
  workflow_dispatch:
    inputs:
      email:
        description: The account to send back in
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Issue a one-hour link
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          EMAIL: ${{ inputs.email }}
        run: |
          TOKEN=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')
          HASH=$(printf '%s' "$TOKEN" | openssl dgst -sha256 -r | cut -d' ' -f1)

          ROWS=$(psql "$PROD_DATABASE_URL" -tAc "
            INSERT INTO ipy_password_reset (user_id, token_hash, expires_at)
            SELECT id, '$HASH', now() + interval '1 hour'
              FROM ipy_user WHERE lower(email) = lower('$EMAIL') AND is_active = true
            RETURNING 1;")

          if [ -z "$ROWS" ]; then
            echo "No active account with that address."
            exit 1
          fi

          echo ""
          echo "Open this within the hour. It works once."
          echo ""
          echo "  https://ipropy-crm.onrender.com/reset-password?token=$TOKEN"
          echo ""
