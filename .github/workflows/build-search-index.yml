name: Build the search index
# One-off, 13 October 2026. A search by meaning took 4.6 seconds because it compared
# the question against all ~117,000 stored vectors. This builds the HNSW index that
# migration 212 deliberately skips on a large table (a deploy must not wait minutes
# for it). CONCURRENTLY, so the site keeps working and saving while it builds.
# Safe to run twice: it does nothing if the index is already there and valid.
# Delete this file once the index exists.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Check the database answers
        run: |
          test -n "$PROD_DATABASE_URL" || { echo "PROD_DATABASE_URL is not set"; exit 1; }
          psql "$PROD_DATABASE_URL" -tAc "SELECT 'connected to ' || current_database() || ', ' || (SELECT count(*) FROM ipy_embedding WHERE dims = 1024) || ' vectors of 1024 numbers'"

      - name: Time a search before the index (skipped once it exists)
        run: |
          # The search vector has to arrive as a plain value, as it does from the app,
          # or the planner cannot use an index; \gset puts one into a psql variable.
          psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -tA <<'SQL'
          SELECT embedding::vector(1024)::text AS v FROM ipy_embedding WHERE dims = 1024 LIMIT 1 \gset
          EXPLAIN (ANALYZE, TIMING OFF, SUMMARY ON)
          SELECT e.id FROM ipy_embedding e WHERE e.dims = 1024
          ORDER BY (e.embedding::vector(1024)) <=> :'v'::vector(1024) LIMIT 400;
          SQL

      - name: Remove a half-built index left by an earlier attempt
        run: |
          psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -tA <<'SQL'
          SELECT 'invalid index found, dropping' WHERE EXISTS (
            SELECT 1 FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid
            WHERE c.relname = 'idx_embedding_nearest_1024' AND NOT i.indisvalid);
          SQL
          INVALID=$(psql "$PROD_DATABASE_URL" -tAc "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid WHERE c.relname = 'idx_embedding_nearest_1024' AND NOT i.indisvalid")
          if [ "$INVALID" != "0" ]; then
            psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP INDEX CONCURRENTLY IF EXISTS idx_embedding_nearest_1024"
          fi

      - name: Build it
        run: |
          # Each statement runs on its own: CONCURRENTLY cannot sit inside a transaction.
          psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SET maintenance_work_mem = '1GB';
          SET max_parallel_maintenance_workers = 2;
          CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_embedding_nearest_1024
            ON ipy_embedding USING hnsw ((embedding::vector(1024)) vector_cosine_ops)
            WHERE dims = 1024;
          SQL

      - name: Check it, and which settings make the planner use it
        run: |
          psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -tA -c "SELECT 'index valid: ' || i.indisvalid || ', size ' || pg_size_pretty(pg_relation_size(c.oid)) FROM pg_index i JOIN pg_class c ON c.oid = i.indexrelid WHERE c.relname = 'idx_embedding_nearest_1024'"
          for N in 100 150 200 250 300 400; do
            echo "=== nearest $N"
            psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -tA <<SQL | grep -E "Index Scan|Seq Scan on ipy_embedding|Execution Time" | sed -E 's/\(cost=[^)]*\)//' | cut -c1-110
          BEGIN;
          SET LOCAL hnsw.ef_search = $N;
          SELECT embedding::vector(1024)::text AS v FROM ipy_embedding WHERE dims = 1024 LIMIT 1 \\gset
          EXPLAIN (ANALYZE, TIMING OFF, SUMMARY ON)
          SELECT e.id FROM ipy_embedding e WHERE e.dims = 1024
          ORDER BY (e.embedding::vector(1024)) <=> :'v'::vector(1024) LIMIT $N;
          COMMIT;
          SQL
          done
