# Why switching a list view off did not take effect on production.
#
# Read-only. It answers three questions that cannot be answered from a laptop,
# in the order they actually matter:
#
#   1. Is the fix even deployed? A commit passing CI is not a commit Render
#      built — this repo has watched a deploy fail sixteen minutes after a green
#      run, which looks exactly like a fix that did not work.
#   2. Did the migration that creates the setting's row run there?
#   3. What does the row actually hold, and under which category?
#
# It prints a settings row and a build string. No credential is printed, and
# nothing is written.
name: Why the list views did not switch off

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is the fix deployed?
        run: |
          echo "--- what production is serving ---"
          curl -fsS https://crm.ipropy.com/api/health || echo "health did not answer"
          echo
          html=$(curl -fsS https://crm.ipropy.com/ || true)
          entry=$(printf '%s' "$html" | grep -ao '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          echo "entry chunk: ${entry:-NONE FOUND}"
          [ -n "$entry" ] || exit 0
          curl -fsS "https://crm.ipropy.com$entry" -o /tmp/entry.js

          # A lazy route's chunk is named after its file and its name lives
          # INSIDE the entry chunk, never in index.html. Grepping what the HTML
          # names finds nothing and reads as a failed deploy — the trap
          # CLAUDE.md records, walked into twice while chasing this bug. The
          # first rewrite then matched on a "./" prefix the bundle does not use,
          # so it followed no chunks at all and answered "no" to everything.
          # `grep -a`: a fetched bundle is binary to grep and prints nothing.
          chunk=$(grep -ao 'assets/ListViewsAdmin-[A-Za-z0-9_-]*\.js' /tmp/entry.js | head -1)
          if [ -z "$chunk" ]; then
            echo "RESULT: the List Views screen is NOT deployed — production is behind"
            exit 0
          fi
          echo "RESULT: the List Views screen IS deployed, as /$chunk"
          curl -fsS "https://crm.ipropy.com/$chunk" -o /tmp/c.js
          grep -aq 'At least one view has to stay on' /tmp/c.js \
            && echo "RESULT: the newest version of that screen is deployed" \
            || echo "RESULT: an OLDER version of that screen is deployed"

      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: What the database says
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "--- what the migration table looks like ---"
          psql "$PROD_DATABASE_URL" -P pager=off -c \
            "SELECT column_name FROM information_schema.columns WHERE table_name = 'ipy_migration';"

          echo "--- the last few migrations applied there ---"
          psql "$PROD_DATABASE_URL" -P pager=off -c \
            "SELECT * FROM ipy_migration ORDER BY 1 DESC LIMIT 6;"

          echo "--- every ui. setting, with its category ---"
          psql "$PROD_DATABASE_URL" -P pager=off -c \
            "SELECT key, category, value, updated_at, updated_by IS NOT NULL AS saved_by_a_person
               FROM ipy_setting WHERE key LIKE 'ui.%' ORDER BY key;"
