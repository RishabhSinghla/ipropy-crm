# Find — and optionally clear — call outcomes that are on no list.
#
# `POST /calls/:id/disposition` accepted any string up to 60 characters until
# 12 September 2026, so production holds calls recorded against outcomes the
# `call_disposition` picklist has never offered. Three of them were written by
# a probe from this repository. They are invisible in the UI and quietly wrong
# in every report that groups by outcome.
#
# Dry run by default: it lists what it found and changes nothing. `apply: true`
# clears those columns to NULL — the call, its notes, its recording and its
# link to the lead all stay; only an outcome nobody can have chosen goes. The
# call then shows up in "needs disposition", which is the honest state for a
# call whose outcome was never really recorded.
#
# An outcome an admin has since deactivated *or retired* is left alone: a rep
# did choose it at the time, and the history is the point. What gets cleared is
# only an outcome that was never on the list at all — which, since nothing in
# the UI could produce one, means something holding an API key wrote it.
name: Tidy call dispositions

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Clear them (unticked = list only, change nothing)"
        type: boolean
        default: false

# Least privilege, stated rather than inherited. The repository default is
# already read-only, but a default is a setting somebody can change in a menu;
# this is the guarantee travelling with the workflow. Raise it here, per job,
# if one ever genuinely needs to write.
permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install psql 18
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Look
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "The list as it stands:"
          psql "$DATABASE_URL" -P pager=off -c "
            SELECT v.value, v.is_active
              FROM ipy_picklist_value v JOIN ipy_picklist p ON p.id = v.picklist_id
             WHERE p.name = 'call_disposition' ORDER BY v.sequence"

          echo "Retired by an admin — real calls, left alone:"
          psql "$DATABASE_URL" -P pager=off -c "
            SELECT c.disposition, count(*) AS calls, max(c.started_at)::date AS last
              FROM ipy_call c
             WHERE c.disposition IS NOT NULL
               AND c.disposition NOT IN (
                 SELECT v.value FROM ipy_picklist_value v
                   JOIN ipy_picklist p ON p.id = v.picklist_id
                  WHERE p.name = 'call_disposition')
               AND EXISTS (SELECT 1 FROM ipy_picklist_tombstone t
                            WHERE t.picklist_name = 'call_disposition' AND t.value = c.disposition)
             GROUP BY 1 ORDER BY 2 DESC"

          echo "On no list and never retired — this is what 'apply' would clear:"
          psql "$DATABASE_URL" -P pager=off -c "
            SELECT c.disposition, count(*) AS calls, min(c.started_at)::date AS first, max(c.started_at)::date AS last
              FROM ipy_call c
             WHERE c.disposition IS NOT NULL
               AND c.disposition NOT IN (
                 SELECT v.value FROM ipy_picklist_value v
                   JOIN ipy_picklist p ON p.id = v.picklist_id
                  WHERE p.name = 'call_disposition')
               AND NOT EXISTS (SELECT 1 FROM ipy_picklist_tombstone t
                                WHERE t.picklist_name = 'call_disposition' AND t.value = c.disposition)
             GROUP BY 1 ORDER BY 2 DESC"

          # Was it deleted on purpose? A tombstone is an admin saying "keep it
          # gone" — the seed honours it on every cold start. Without one, a
          # value the picklist is missing is more likely to have been lost than
          # retired, and putting it back is the right fix rather than clearing
          # the calls that used it.
          echo "Deliberately retired outcomes:"
          psql "$DATABASE_URL" -P pager=off -c "
            SELECT value, deleted_at::date AS retired, had_records, replaced_with
              FROM ipy_picklist_tombstone
             WHERE picklist_name = 'call_disposition' ORDER BY deleted_at"

      - name: Clear them
        if: ${{ inputs.apply }}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          # `disposition_at` goes with it: a timestamp saying when an outcome
          # was recorded, next to no outcome, reads as a bug in the CRM.
          N="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "
            WITH cleared AS (
              UPDATE ipy_call SET disposition = NULL, disposition_at = NULL
               WHERE disposition IS NOT NULL
                 AND disposition NOT IN (
                   SELECT v.value FROM ipy_picklist_value v
                     JOIN ipy_picklist p ON p.id = v.picklist_id
                    WHERE p.name = 'call_disposition')
                 AND NOT EXISTS (SELECT 1 FROM ipy_picklist_tombstone t
                                  WHERE t.picklist_name = 'call_disposition'
                                    AND t.value = ipy_call.disposition)
              RETURNING 1)
            SELECT count(*) FROM cleared")"
          echo "::notice::Cleared ${N} call(s). They now appear in 'needs disposition' for whoever made them."
