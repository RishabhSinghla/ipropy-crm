# Who is filling the WhatsApp hand-off queue, and a way to empty it.
#
# On 16 September 2026 the queue held 40,515 messages waiting for a person to
# tap send. 40,509 of them were made in seven days: 20,006 on the 13th and
# 20,000 on the 16th, one row per lead both times, every one stamped
# "Workflow — no WhatsApp Business account connected". 20,209 leads sit there
# with two messages each, so the same workflow has swept the whole database
# twice.
#
# That queue is harmless while it only drains by hand. It stops being harmless
# the day a WhatsApp Business account is connected, because then forty thousand
# messages addressed to real customers have nothing between them and a send
# button. Hence both halves here: find the workflow, and be able to clear what
# it has already made.
#
# Looking is read-only and prints no message body. Clearing requires typing the
# word, only removes rows still waiting, and copies every one into
# ipy_device_send_cleared first.
name: WhatsApp queue

on:
  workflow_dispatch:
    inputs:
      clear:
        description: "Type clear to remove the waiting messages. Anything else only looks."
        default: "look"
      keep_days:
        description: "Keep anything queued in the last N days (default 1)."
        default: "1"

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Which workflow is doing this
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "--- every workflow with a WhatsApp step ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT w.name, m.name AS module, w.trigger, w.is_active, w.is_system,
                 w.execution_mode,
                 jsonb_array_length(coalesce(w.conditions->'conditions','[]'::jsonb)) AS conditions,
                 w.run_count,
                 coalesce(to_char(w.last_run_at, 'YYYY-MM-DD HH24:MI'), 'never') AS last_run,
                 coalesce(to_char(w.next_run_at, 'YYYY-MM-DD HH24:MI'), '-') AS next_run,
                 left(coalesce(w.schedule::text, '-'), 80) AS schedule
            FROM ipy_workflow w
            JOIN ipy_module m ON m.id = w.module_id
           WHERE EXISTS (SELECT 1 FROM ipy_workflow_task t
                          WHERE t.workflow_id = w.id AND t.type LIKE '%whatsapp%')
           ORDER BY w.is_active DESC, w.run_count DESC;
          SQL

          echo "--- what each one is told to do it to ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT w.name, w.is_active,
                 left(w.conditions::text, 400) AS conditions
            FROM ipy_workflow w
           WHERE EXISTS (SELECT 1 FROM ipy_workflow_task t
                          WHERE t.workflow_id = w.id AND t.type LIKE '%whatsapp%')
           ORDER BY w.is_active DESC;
          SQL

          echo "--- the busiest workflows of the last fortnight ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT w.name, w.trigger, w.is_active, w.run_count,
                 coalesce(to_char(w.last_run_at, 'YYYY-MM-DD HH24:MI'), 'never') AS last_run
            FROM ipy_workflow w
           ORDER BY w.run_count DESC LIMIT 15;
          SQL

      - name: Clear the waiting messages
        if: ${{ inputs.clear == 'clear' }}
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          KEEP_DAYS: ${{ inputs.keep_days }}
        run: |
          # Only rows still waiting, only the ones this workflow made, and only
          # older than the keep window — so anything a rep queued this morning
          # by hand survives. Nothing opened, sent or skipped is touched: that
          # is the record of what actually happened.
          psql "$PROD_DATABASE_URL" -P pager=off -v keep="${KEEP_DAYS:-1}" <<'SQL'
          BEGIN;
          CREATE TABLE IF NOT EXISTS ipy_device_send_cleared (LIKE ipy_device_send);
          INSERT INTO ipy_device_send_cleared
            SELECT * FROM ipy_device_send
             WHERE status = 'pending'
               AND reason = 'Workflow — no WhatsApp Business account connected'
               AND created_at < now() - (:'keep' || ' days')::interval;
          DELETE FROM ipy_device_send
           WHERE status = 'pending'
             AND reason = 'Workflow — no WhatsApp Business account connected'
             AND created_at < now() - (:'keep' || ' days')::interval;
          COMMIT;
          SQL
          echo "--- what is left ---"
          psql "$PROD_DATABASE_URL" -P pager=off -c "
            SELECT status, count(*)::int AS rows FROM ipy_device_send GROUP BY status ORDER BY rows DESC;"
          psql "$PROD_DATABASE_URL" -tAc "
            SELECT 'kept safe in ipy_device_send_cleared: ' || count(*) FROM ipy_device_send_cleared;"
