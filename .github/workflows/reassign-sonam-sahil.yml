# Move every record held by Sonam Aggarwal and Sahil Malik (both inactive) to Yogesh Bindal.
# Old owners are kept in ipy_reassigned_owner so it can be undone. Guarded.
name: Reassign Sonam and Sahil records to Yogesh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reassign
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          cat > q.sql <<'SQL'
          \set ON_ERROR_STOP on
          BEGIN;
          CREATE TABLE IF NOT EXISTS ipy_reassigned_owner (record_id uuid, old_owner uuid, new_owner uuid, moved_at timestamptz DEFAULT now());
          CREATE TEMP TABLE the_old AS
            SELECT u.id FROM ipy_user u
            WHERE u.is_active = false AND lower(u.first_name || ' ' || u.last_name) IN ('sonam aggarwal', 'sahil malik');
          DO $$ DECLARE n int; BEGIN
            SELECT count(*) INTO n FROM the_old;
            IF n <> 2 THEN RAISE EXCEPTION 'expected 2 users, found %', n; END IF;
          END $$;
          INSERT INTO ipy_reassigned_owner (record_id, old_owner, new_owner)
            SELECT id, owner_id, '671d65cc-1ac6-4bc9-b5fd-f4fee85261f7' FROM ipy_record
            WHERE owner_id IN (SELECT id FROM the_old) AND is_deleted = false;
          DO $$ DECLARE n int; BEGIN
            SELECT count(*) INTO n FROM ipy_reassigned_owner WHERE moved_at > now() - interval '1 minute';
            IF n < 1 OR n > 200 THEN RAISE EXCEPTION 'unexpected count %', n; END IF;
          END $$;
          UPDATE ipy_record SET owner_id = '671d65cc-1ac6-4bc9-b5fd-f4fee85261f7'
            WHERE id IN (SELECT record_id FROM ipy_reassigned_owner WHERE moved_at > now() - interval '1 minute');
          SELECT count(*) AS moved FROM ipy_reassigned_owner WHERE moved_at > now() - interval '1 minute';
          SELECT count(*) AS still_with_them FROM ipy_record WHERE owner_id IN (SELECT id FROM the_old) AND is_deleted = false;
          COMMIT;
          SQL
          sed -i 's/^ *//' q.sql
          psql "$PROD_DATABASE_URL" -X -q -P pager=off -f q.sql 2>&1
