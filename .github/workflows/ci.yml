name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    # A change to a note, a readme or a memory file cannot break a build, and
    # running three jobs to prove that costs about fifteen billed minutes.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:

# Three pushes in ten minutes used to mean nine jobs, of which only the last
# three mattered. The earlier ones are cancelled now — the deploy gate only ever
# looks at the newest commit anyway, so finishing the older runs proved nothing
# and was billed the same.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The integration suite needs a real Postgres; it provisions its own
    # scratch database inside this one (see tests/integration/globalSetup.ts).
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ipropy
          POSTGRES_PASSWORD: ipropy
          POSTGRES_DB: ipropy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://ipropy:ipropy@localhost:5432/ipropy
      JWT_SECRET: ci-secret-long-enough-to-pass-the-production-startup-checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      # Last, not first.
      #
      # This ran before the tests and failed on a published advisory in a
      # transitive dependency. A failed step skips every step after it, so
      # typecheck, build and both test suites did not run at all — for days,
      # across every push, while the runs showed red for a reason that had
      # nothing to do with the code in them. Five fixes went out believing CI
      # had checked them; it had checked nothing.
      #
      # A stale advisory in somebody else's package should not be able to hide
      # whether this code compiles and passes its tests. But with the deploy
      # gate on `checksPass`, a permanently red audit makes the gate itself
      # unreadable — deploys have gone out anyway while runs failed, so the
      # one thing the gate exists to say can no longer be told from the thing
      # that is merely noisy.
      #
      # The allowlist (scripts/security-audit.mjs) is how the signal survives:
      # advisories nobody can fix yet (fast-uri via the MCP SDK's ajv, qs via
      # express) are accepted by name, each with a reason and what retires it,
      # and anything NEW still fails the build. Development tooling included: a
      # compromised build dependency can still alter the production bundle this
      # job publishes evidence for.
      - name: Security audit
        run: npm audit --json | node scripts/security-audit.mjs

  # Build the image Render actually deploys.
  #
  # `verify` builds from a clean checkout and so catches build-order breaks, but
  # it never touches the Dockerfile — and the Dockerfile has its own ways to
  # fail that no npm script can see: a workspace missing from the deps stage, a
  # COPY that does not match, a .dockerignore pattern that hides a whole
  # directory. Those failures used to be discovered by Render, one email at a
  # time, after the push had already landed on main.
  #
  # No registry and no push: building it is the whole test.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        # linux/amd64 is what Render runs, and it is the runner's own
        # architecture, so this needs no emulation.
        run: docker build --platform linux/amd64 -t ipropy-crm:ci .

  # Kept separate from `verify` rather than appended to it: this job needs a
  # seeded database and two running servers, it is the slowest by far, and when
  # it breaks the cause is almost never the same as a typecheck or unit failure.
  # A separate job also means both report independently instead of the first
  # one to fail hiding the other.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ipropy
          POSTGRES_PASSWORD: ipropy
          POSTGRES_DB: ipropy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://ipropy:ipropy@localhost:5432/ipropy
      JWT_SECRET: ci-secret-long-enough-to-pass-the-production-startup-checks
      # The specs sign in as the seeded admin. Defaults in e2e/helpers.ts match
      # the seed defaults, so nothing extra is needed here — but being explicit
      # means a change to either side fails loudly instead of silently logging
      # in as the wrong user.
      E2E_EMAIL: admin@ipropy.com
      E2E_PASSWORD: Admin@123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the workspaces the server imports
        # Not just @ipropy/shared. The server imports @ipropy/mcp from
        # api/routes/mcp.ts, and tsx resolves it to dist/lib.js at *runtime* —
        # so with only shared built, playwright.config.ts starts the API, the
        # API dies on ERR_MODULE_NOT_FOUND, and the only symptom is
        # "Timed out waiting 120000ms from config.webServer".
        run: npm run build:deps
      - name: Prepare database
        # Fresh Postgres every run, so the demo seed populates the records the
        # list-view specs need. SEED_DEMO_DATA defaults to true outside
        # production; the deployed config sets it false.
        run: npm run db:migrate && npm run db:seed
      - name: Install Playwright browsers
        # Both projects are Chromium-based (the mobile one is a Pixel 7
        # descriptor), so the other engines would be dead weight.
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        # playwright.config.ts starts the API and web servers itself and waits
        # for both; reuseExistingServer is off when CI is set.
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
