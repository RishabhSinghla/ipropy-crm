# Point production at the automation server, and give both ends one secret.
#
# Run manually. The secret is **supplied** as a repository secret and is never
# generated here and never printed. It used to be `openssl rand` followed by an
# `echo`, and **this repository is public** — so the run on 18 August 2026
# published the callback secret to the internet. That secret is the only thing
# standing between the open webhooks router and anything that can raise a
# notification in the CRM.
#
# Set it yourself, so you already have the value to put on the n8n machine:
#
#   openssl rand -hex 24                      # keep this, it is what n8n needs
#   gh secret set N8N_CALLBACK_SECRET         # paste it, never committed
#
# then run this workflow. `probe-prod-schema.yml` had the rule right all along:
# it prints counts and never a value, "because this log is public".
name: Set n8n config
on:
  workflow_dispatch:
    inputs:
      webhook_url:
        description: "n8n webhook URL. Blank keeps whatever production already has."
        required: false
        default: ""
        required: false
        default: ""

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql 18
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Write the config
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          WEBHOOK_URL: ${{ inputs.webhook_url }}
          SECRET: ${{ secrets.N8N_CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "::error::No N8N_CALLBACK_SECRET is set. Generate one with 'openssl rand -hex 24',"
            echo "::error::keep it for the n8n machine, and add it with 'gh secret set N8N_CALLBACK_SECRET'."
            exit 1
          fi

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO ipy_integration (provider, kind, label, is_active, status, config, credentials)
          SELECT 'n8n', 'storage', 'n8n automation', true, 'connected',
                 jsonb_build_object('webhookUrl', '${WEBHOOK_URL}'),
                 jsonb_build_object('callbackSecret', '${SECRET}')
          WHERE NOT EXISTS (SELECT 1 FROM ipy_integration WHERE provider = 'n8n');

          UPDATE ipy_integration
             SET is_active = true,
                 status = 'connected',
                 -- Blank leaves the existing URL alone rather than erasing it.
                 -- This workflow is now the way the callback secret is rotated,
                 -- and a rotation must not quietly take the webhook URL with it.
                 config = COALESCE(config,'{}'::jsonb)
                          || CASE WHEN '${WEBHOOK_URL}' = ''
                                  THEN '{}'::jsonb
                                  ELSE jsonb_build_object('webhookUrl', '${WEBHOOK_URL}') END,
                 credentials = COALESCE(credentials,'{}'::jsonb) || jsonb_build_object('callbackSecret', '${SECRET}')
           WHERE provider = 'n8n';
          SQL

          # Never echoed. You already have the value — you generated it and put
          # it in the repository secret, and it goes on the n8n machine as
          # IPROPY_CALLBACK_SECRET.
          echo "::notice::n8n configured on production with the supplied callback secret."

      - name: Say what still needs doing
        run: |
          echo "The CRM must be restarted for this to take effect — its"
          echo "integration settings are an in-memory snapshot warmed at boot."
