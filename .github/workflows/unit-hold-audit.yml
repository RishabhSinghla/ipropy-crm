# Why does "Unit hold expired" repeat?
#
# The hourly "Release expired blocks" rule sets a held unit back to Available
# and then tells its owner. If the release step fails, the tell step still
# runs, so the same unit is announced every hour. This reads what the rule
# logged and what the units look like now. Read-only: SELECTs only.
#
# Run by hand: Actions -> Unit hold audit -> Run workflow.
name: Unit hold audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: The rule itself
        run: |
          test -n "$PROD_DATABASE_URL" || { echo "PROD_DATABASE_URL is not set"; exit 1; }
          psql "$PROD_DATABASE_URL" -X -c "
            SELECT w.name, w.is_active, w.trigger, w.run_count,
                   to_char(w.last_run_at AT TIME ZONE 'Asia/Kolkata', 'DD Mon HH24:MI') AS last_run
            FROM ipy_workflow w WHERE w.name = 'Release expired blocks';"
          psql "$PROD_DATABASE_URL" -X -c "
            SELECT t.sequence, t.type, t.name, t.config
            FROM ipy_workflow_task t JOIN ipy_workflow w ON w.id = t.workflow_id
            WHERE w.name = 'Release expired blocks' ORDER BY t.sequence;" || true

      - name: What the rule logged in the last two days
        run: |
          psql "$PROD_DATABASE_URL" -X -c "
            SELECT l.record_id, l.status, count(*) AS runs, left(max(l.error), 160) AS error,
                   to_char(min(l.created_at) AT TIME ZONE 'Asia/Kolkata', 'DD Mon HH24:MI') AS first,
                   to_char(max(l.created_at) AT TIME ZONE 'Asia/Kolkata', 'DD Mon HH24:MI') AS last
            FROM ipy_workflow_log l JOIN ipy_workflow w ON w.id = l.workflow_id
            WHERE w.name = 'Release expired blocks' AND l.created_at > now() - interval '2 days'
            GROUP BY l.record_id, l.status ORDER BY runs DESC LIMIT 20;"

      - name: The units it keeps matching, as they are now
        run: |
          psql "$PROD_DATABASE_URL" -X -c "
            SELECT r.id, m.name AS module,
                   coalesce(to_jsonb(p)->>'status', p.custom_fields->>'status') AS status,
                   to_jsonb(p)->>'blocked_until' AS blocked_until,
                   r.is_deleted
            FROM ipy_record r
            JOIN ipy_module m ON m.id = r.module_id
            JOIN ipy_e_properties p ON p.record_id = r.id
            WHERE r.id IN (
              SELECT DISTINCT l.record_id FROM ipy_workflow_log l
              JOIN ipy_workflow w ON w.id = l.workflow_id
              WHERE w.name = 'Release expired blocks' AND l.created_at > now() - interval '2 days');"

      - name: The Status options a unit may hold
        run: |
          psql "$PROD_DATABASE_URL" -X -c "
            SELECT v.value, v.is_active
            FROM ipy_picklist_value v JOIN ipy_picklist pl ON pl.id = v.picklist_id
            WHERE pl.name = 'property_status' ORDER BY v.sequence;" || true
