# Set the owner's production password from a hash computed elsewhere.
#
# Takes a bcrypt hash, never a password. The hash is what the database stores
# anyway, so putting one through a workflow input adds no exposure — whereas a
# plaintext password in a run's inputs would sit in the log for as long as the
# run is kept.
#
# This exists for the same reason the reset-link workflow does: the owner is the
# only admin and production has no email, so a forgotten password has no route
# back. Delete both once email is connected.
name: Set admin password

on:
  workflow_dispatch:
    inputs:
      email:
        description: Which account
        required: true
      hash:
        description: bcrypt hash (never the password itself)
        required: true

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Apply it
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          EMAIL: ${{ inputs.email }}
          HASH: ${{ inputs.hash }}
        run: |
          case "$HASH" in
            '$2a$'*|'$2b$'*|'$2y$'*) ;;
            *) echo "That is not a bcrypt hash. Refusing, in case it is a password."; exit 1 ;;
          esac

          psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            UPDATE ipy_user
               SET password_hash = '$HASH', password_changed_at = now(), is_active = true
             WHERE lower(email) = lower('$EMAIL');"

          # Everything signed in elsewhere is signed out, exactly as a normal
          # password change does. A password change that leaves old sessions
          # alive has not really changed anything.
          psql "$PROD_DATABASE_URL" -c "
            UPDATE ipy_session SET revoked_at = now()
             WHERE revoked_at IS NULL
               AND user_id = (SELECT id FROM ipy_user WHERE lower(email) = lower('$EMAIL'));"

          # Any outstanding reset links die with it.
          psql "$PROD_DATABASE_URL" -c "
            UPDATE ipy_password_reset SET used_at = now()
             WHERE used_at IS NULL
               AND user_id = (SELECT id FROM ipy_user WHERE lower(email) = lower('$EMAIL'));"

          echo "done"
