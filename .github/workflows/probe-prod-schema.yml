# Print production's real table shape, on demand.
#
# Production's schema has drifted from what 002_entities.sql declares — an
# applied migration never re-runs, so every column added to that file after
# production first ran it is simply absent there. Two deploys were spent
# discovering that one column at a time from Render's logs, which no local
# gate can see. This reads the answer instead of guessing it.
#
# Read-only and deliberately narrow: column *names* and applied migration
# names, never row data. workflow_dispatch only.
name: Probe prod schema

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report schema drift
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "No PROD_DATABASE_URL secret configured." >&2
            exit 1
          fi
          echo "=== last applied migrations ==="
          psql "$PROD_DATABASE_URL" -tAc \
            "SELECT name FROM ipy_migration ORDER BY name DESC LIMIT 12;"
          echo
          for t in ipy_e_properties ipy_e_leads; do
            echo "=== $t columns ==="
            psql "$PROD_DATABASE_URL" -tAc \
              "SELECT string_agg(column_name, ', ' ORDER BY column_name)
                 FROM information_schema.columns WHERE table_name = '$t';"
            echo
          done

          # The metadata beside the schema, because the two disagreeing is the
          # whole failure mode. A column with no field is dead storage; a field
          # with no column is a 42703 waiting for the next query that names it;
          # and a column that keeps coming back after a migration dropped it
          # means something is recreating the field row. Names and flags only.
          for m in properties leads; do
            # `name -> column_name`, because the two differ the moment somebody
            # renames a field: a rename changes the name and never the column.
            # Reading only names is how a migration comes to delete the wrong
            # row and leave the right column standing.
            echo "=== $m: column-backed fields (name -> column) ==="
            psql "$PROD_DATABASE_URL" -tAc \
              "SELECT string_agg(f.name ||
                                 CASE WHEN f.name = f.column_name THEN '' ELSE ' -> ' || f.column_name END ||
                                 CASE WHEN f.is_active THEN '' ELSE '(hidden)' END,
                                 ', ' ORDER BY f.name)
                 FROM ipy_field f JOIN ipy_module mo ON mo.id = f.module_id
                WHERE mo.name = '$m' AND f.storage = 'column';"
            echo
            echo "=== $m: tombstoned fields ==="
            psql "$PROD_DATABASE_URL" -tAc \
              "SELECT string_agg(field_name, ', ' ORDER BY field_name)
                 FROM ipy_field_tombstone WHERE module_name = '$m';"
            echo
          done

          # How full the matching-relevant columns are. Counts only — never a
          # value — because this log is public. A field can exist, be mapped
          # and still contribute nothing to a match because every row is null,
          # which looks identical to "matching is bad" from the outside.
          # Read through `to_jsonb`, not by naming columns: this probe exists
          # because production loses columns, and naming one that has gone
          # aborts the step (`shell: bash -e`) and hides everything after it.
          # That is the same lesson the query code already learned.
          echo "=== fill rates on the columns matching reads (counts only) ==="
          # Counts only — never a value — because this log is public. A field
          # can exist, be mapped and still contribute nothing to a match
          # because every row is null, which looks identical to "matching is
          # bad" from the outside.
          #
          # `count(to_jsonb(p)->>'col')` on a column production has dropped
          # returns 0, not an error — so the honest answer "that column is
          # gone" and the alarming one "every row is empty" printed the same
          # digit. This asks information_schema which of them still exist and
          # says `absent` for the rest, which is the fact worth knowing: a
          # dropped column is a 42703 waiting for the next query that names it.
          for spec in "ipy_e_properties:carpet_area,area_size,configuration,base_price,asking_price,total_price,demand,locality,preferred_locations,status" \
                      "ipy_e_leads:budget,configuration,preferred_locations,area,area_size,mobile,status"; do
            table="${spec%%:*}"; cols="${spec#*:}"
            live=$(psql "$PROD_DATABASE_URL" -tAc \
              "SELECT coalesce(string_agg(c, ', ' || chr(39)), '')
                 FROM unnest(string_to_array('$cols', ',')) c
                WHERE EXISTS (SELECT 1 FROM information_schema.columns
                               WHERE table_name = '$table' AND column_name = c);")
            gone=$(psql "$PROD_DATABASE_URL" -tAc \
              "SELECT coalesce(string_agg(c, ', '), '(none)')
                 FROM unnest(string_to_array('$cols', ',')) c
                WHERE NOT EXISTS (SELECT 1 FROM information_schema.columns
                                   WHERE table_name = '$table' AND column_name = c);")
            sel=$(psql "$PROD_DATABASE_URL" -tAc \
              "SELECT coalesce(string_agg(format('%L || %L || count(to_jsonb(t)->>%L)', ', ' || c || '=', '', c), ' || '), )
                 FROM unnest(string_to_array('$cols', ',')) c
                WHERE EXISTS (SELECT 1 FROM information_schema.columns
                               WHERE table_name = '$table' AND column_name = c);")
            psql "$PROD_DATABASE_URL" -tAc \
              "SELECT '$table rows=' || count(*) || $sel FROM $table t;"
            echo "  absent from $table: $gone"
          done
          echo
          echo "=== are the matching pairs actually configured? ==="
          psql "$PROD_DATABASE_URL" -tAc \
            "SELECT coalesce(string_agg(sf.name || ' -> ' || tf.name, ', '), '(none)')
               FROM ipy_field_mapping fm
               JOIN ipy_field sf ON sf.internal_id = fm.source_field_internal_id
               JOIN ipy_field tf ON tf.internal_id = fm.target_field_internal_id
              WHERE fm.purpose = 'matching' AND fm.is_active;"
          echo
          echo "=== json-storage (admin-created) fields ==="
          # Name alone is not enough to reproduce one. A picklist without its
          # `picklist` config has no list, and an area field without its
          # `unitMaster` has no Sq Ft / Sq Yd — so a mirror built from names
          # only tells you the CRM is broken in ways production is not.
          for m in properties leads; do
            psql "$PROD_DATABASE_URL" -tAc \
              "SELECT '$m|' || f.name || '|' || f.uitype || '|' || f.label
                      || '|' || coalesce(f.config::text, '{}')
                      || '|' || (CASE WHEN f.is_active THEN 'active' ELSE 'hidden' END)
                 FROM ipy_field f JOIN ipy_module mo ON mo.id = f.module_id
                WHERE mo.name = '$m' AND f.storage = 'json'
                ORDER BY f.name;"
          done
          echo
          echo "=== values archived by a permanent delete (counts only) ==="
          psql "$PROD_DATABASE_URL" -tAc \
            "SELECT coalesce(string_agg(table_name || '.' || column_name || '=' || n, ', '), '(none)')
               FROM (SELECT table_name, column_name, count(*)::text AS n
                       FROM ipy_dropped_column GROUP BY 1,2) t;"
