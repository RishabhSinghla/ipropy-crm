# Is WhatsApp actually working on production? Read-only.
#
# Exists because this repository is developed on a machine whose egress proxy
# refuses both `crm.ipropy.com` and `app.whatsmarketing.in`, so the only honest
# way to answer "did that reply arrive" is to ask production's own database.
# Nothing here writes, and no credential is printed — only whether one is set.
#
# It answers, in order, the questions that actually get asked when somebody
# says WhatsApp is not working:
#
#   * Is a provider switched on, and which one?
#   * Is the Phone Number ID filled in? (The key and the id live on different
#     pages of WhatsMarketing's dashboard, so one without the other is the
#     usual state of a half-finished setup.)
#   * Have any replies come in at all, and when was the last one?
#   * Is the 24-hour window open on those conversations? That is the field
#     that decides whether a rep is allowed to type, and it is set only when
#     an inbound message lands.
#   * Have any templates synced?
name: Check WhatsApp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Which provider is on
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT provider,
                 is_active,
                 -- Never the value. Only whether there is one.
                 (credentials IS NOT NULL) AS has_credentials,
                 COALESCE(config->>'phoneNumberId', '(not set)')  AS phone_number_id,
                 COALESCE(config->>'businessNumber', '(not set)') AS business_number,
                 COALESCE(config->>'baseUrl', '(default)')        AS base_url,
                 status, last_sync_at, last_error
            FROM ipy_integration
           WHERE provider LIKE 'whatsapp%'
           ORDER BY is_active DESC, provider;
          SQL

      - name: Have replies arrived
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "--- conversations on the business number ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT c.handle, c.contact_name,
                 (SELECT count(*)::int FROM ipy_message m
                   WHERE m.conversation_id = c.id AND m.direction = 'inbound') AS from_them,
                 (SELECT count(*)::int FROM ipy_message m
                   WHERE m.conversation_id = c.id AND m.direction = 'outbound') AS from_us,
                 c.last_message_at,
                 c.window_expires_at,
                 -- The one that decides whether a rep may type at all.
                 (c.window_expires_at > now()) AS can_reply_freely
            FROM ipy_conversation c
           WHERE c.channel = 'whatsapp'
           ORDER BY c.last_message_at DESC NULLS LAST
           LIMIT 15;
          SQL

          echo "--- the last few messages either way ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT m.direction, m.route, m.status,
                 left(coalesce(m.body, '(no text)'), 60) AS body,
                 m.created_at
            FROM ipy_message m
            JOIN ipy_conversation c ON c.id = m.conversation_id
           WHERE c.channel = 'whatsapp'
           ORDER BY m.created_at DESC
           LIMIT 10;
          SQL

          echo "--- why a send failed, which the message row already knows ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT m.created_at,
                 -- Which number it was going to. "Outside the 24-hour window"
                 -- is a correct refusal for a number that never wrote to us
                 -- and a real bug for one that just did, and the handle is the
                 -- only thing that tells those apart.
                 c.handle,
                 c.last_inbound_at,
                 c.window_expires_at,
                 left(coalesce(m.body, '(template)'), 18) AS body,
                 m.status,
                 -- The whole point of this block. A send that failed has a
                 -- reason on it, and until now nothing printed it, so every
                 -- failure looked identical from outside the container.
                 left(coalesce(m.error_message, '(no reason recorded)'), 160) AS why
            FROM ipy_message m
            JOIN ipy_conversation c ON c.id = m.conversation_id
           WHERE c.channel = 'whatsapp' AND m.direction = 'outbound'
           ORDER BY m.created_at DESC
           LIMIT 8;
          SQL

          echo "--- is a conversation attached to a record? (the WhatsApp tab needs this) ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT c.handle,
                 c.record_id IS NOT NULL AS linked_to_a_record,
                 c.record_module,
                 -- And whether a contact with that number exists at all: an
                 -- unlinked thread with a matching contact is a bug, one with
                 -- no contact is simply a stranger.
                 -- `to_jsonb` so a field an admin has deleted answers NULL
                 -- rather than raising 42703 and taking the whole check down,
                 -- which is exactly what `whatsapp_number` just did.
                 (SELECT count(*)::int FROM ipy_e_leads l
                    WHERE right(regexp_replace(coalesce(to_jsonb(l)->>'mobile', ''), '\D', '', 'g'), 10) = c.handle
                       OR right(regexp_replace(coalesce(to_jsonb(l)->>'whatsapp_number', ''), '\D', '', 'g'), 10) = c.handle
                 ) AS contacts_with_that_number
            FROM ipy_conversation c
           WHERE c.channel = 'whatsapp'
           ORDER BY c.last_message_at DESC NULLS LAST
           LIMIT 8;
          SQL

          echo "--- what the poller has claimed (proof it is running) ---"
          psql "$PROD_DATABASE_URL" -tAc "
            SELECT 'deliveries claimed: ' || count(*)
              || ' | newest: ' || COALESCE(max(received_at)::text, 'never')
              FROM ipy_wa_webhook_event;"

          echo "--- what the last inbound check actually saw ---"
          psql "$PROD_DATABASE_URL" -tAc "
            SELECT COALESCE(
              (SELECT value::text FROM ipy_setting WHERE key = 'whatsapp.last_poll'),
              'the poller has not reported yet');"

          echo "--- templates ---"
          psql "$PROD_DATABASE_URL" -tAc "
            SELECT 'templates synced: ' || count(*) FROM ipy_whatsapp_template;"

      - name: Why a template send failed
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          # Two red bubbles on 20 September said two different things about the
          # same template, eight minutes apart. "Not found" is ours to fix;
          # a Meta error code is not. Which it is has to be read, never guessed.
          echo "--- the last outbound messages and what came back ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT m.created_at, m.status, m.template_name,
                 left(coalesce(m.error_message, ''), 160) AS error
            FROM ipy_message m
            JOIN ipy_conversation c ON c.id = m.conversation_id
           WHERE c.channel = 'whatsapp' AND m.direction = 'outbound'
           ORDER BY m.created_at DESC
           LIMIT 12;
          SQL

          # The category matters: Meta caps how many *marketing* templates one
          # person may receive, and a utility template is not capped the same
          # way — so the category is the difference between fixable and not.
          # (`provider_template_id` is the only id the CRM stores; the second
          # one the adapter retries with is held in memory, not a column.)
          echo "--- the templates and their category ---"
          psql "$PROD_DATABASE_URL" -P pager=off <<'SQL'
          SELECT name, language, status, category, provider_template_id
            FROM ipy_whatsapp_template
           ORDER BY name;
          SQL
