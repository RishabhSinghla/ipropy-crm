# Time the global search's own query on production, read-only.
#
# 11 October 2026, the owner: typing in the search bar finds nothing. The
# screen shows "No matches" for ANY failure (the box swallows errors), so the
# only honest way to tell a slow or failing query from a true empty answer is
# to run the same SQL against production and look at the plan and the time.
# Prints counts and timings only, never row data. workflow_dispatch only.
name: Why search is slow

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Time the search
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then echo "No PROD_DATABASE_URL secret." >&2; exit 1; fi
          q() {
            echo; echo "=== $1 ==="
            printf 'BEGIN READ ONLY;\nSET LOCAL statement_timeout = 55000;\n%s\nCOMMIT;\n' "$2" \
              | psql "$PROD_DATABASE_URL" -X -q -P pager=off 2>&1 || true
          }
          q "how big are the things search reads" "SELECT
              (SELECT count(*) FROM ipy_record) AS records,
              (SELECT count(*) FROM ipy_comment) AS comments,
              (SELECT pg_size_pretty(pg_total_relation_size('ipy_comment'))) AS comments_size,
              (SELECT pg_size_pretty(pg_total_relation_size('ipy_record'))) AS records_size;"
          q "indexes on the comment table" "SELECT indexname FROM pg_indexes WHERE tablename = 'ipy_comment';"
          q "indexes on search columns of ipy_record" "SELECT indexname FROM pg_indexes WHERE tablename = 'ipy_record' AND (indexdef ILIKE '%search%' OR indexdef ILIKE '%label%');"
          for term in 'rishabh' '9891222206' 'sharma'; do
            q "plan and time, term of ${#term} characters, WITH notes (what the box runs)" "EXPLAIN (ANALYZE, BUFFERS, COSTS OFF, TIMING OFF)
              SELECT r.id FROM ipy_record r
              WHERE r.is_deleted = false AND r.archived_at IS NULL
                AND (r.label ILIKE '%${term}%' OR r.record_number ILIKE '%${term}%' OR r.search_text ILIKE '%${term}%'
                  OR EXISTS (SELECT 1 FROM ipy_comment c WHERE c.record_id = r.id AND c.body ILIKE '%${term}%')
                  OR r.search_vector @@ to_tsquery('simple', '${term}:*'))
              ORDER BY r.updated_at DESC LIMIT 20;"
            q "same, WITHOUT notes" "EXPLAIN (ANALYZE, BUFFERS, COSTS OFF, TIMING OFF)
              SELECT r.id FROM ipy_record r
              WHERE r.is_deleted = false AND r.archived_at IS NULL
                AND (r.label ILIKE '%${term}%' OR r.record_number ILIKE '%${term}%' OR r.search_text ILIKE '%${term}%'
                  OR r.search_vector @@ to_tsquery('simple', '${term}:*'))
              ORDER BY r.updated_at DESC LIMIT 20;"
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run the real search code, as the most recent user
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          NODE_ENV: production
          JWT_SECRET: not-used-by-this-script-0123456789abcdef
        run: |
          npm ci --ignore-scripts
          npm run build -w @ipropy/shared
          npm run build -w @ipropy/mcp
          cd packages/server && npx tsx scripts/try-search.ts 2>&1 | tail -30
