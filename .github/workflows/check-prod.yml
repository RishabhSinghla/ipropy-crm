# Read-only look at production, for questions the deployed site cannot answer
# without a login.
#
# Exists because the person building this cannot sign in to production and
# should not be asking the owner to read values back over chat — that is how
# "I connected it" and "it is connected" drift apart. The runner already holds
# the database URL for the nightly backup; this borrows it to answer yes/no
# questions and prints no secret, only whether one is present.
name: Check production

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: What production actually has configured
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          psql "$PROD_DATABASE_URL" -P pager=off -c "
            SELECT provider,
                   is_active                       AS switched_on,
                   config->>'driver'               AS driver,
                   config->>'bucket'               AS bucket,
                   (config->>'endpoint' <> '')     AS has_endpoint,
                   (credentials ? 'accessKeyId')   AS has_key,
                   (credentials ? 'secretAccessKey') AS has_secret
              FROM ipy_integration
             WHERE provider IN ('s3','onedrive');"
          echo "--- what the CRM is storing files with ---"
          psql "$PROD_DATABASE_URL" -P pager=off -tAc "
            SELECT 'attachments: ' || count(*) ||
                   ', on R2-style keys: ' || count(*) FILTER (WHERE storage_key NOT LIKE 'unfiled/%')
              FROM ipy_attachment;"

      - name: The data model, as production actually has it
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "--- can this database do vector search ---"
          psql "$PROD_DATABASE_URL" -P pager=off -c "
            SELECT name, default_version, installed_version
              FROM pg_available_extensions WHERE name IN ('vector','pg_trgm');"

          echo "--- migrations, newest first ---"
          psql "$PROD_DATABASE_URL" -P pager=off -tAc "
            SELECT name FROM ipy_migration ORDER BY name DESC LIMIT 6;"

          echo "--- phone fields and the code they show ---"
          psql "$PROD_DATABASE_URL" -P pager=off -c "
            SELECT m.name AS module, f.name AS field, f.config::text
              FROM ipy_field f JOIN ipy_module m ON m.id = f.module_id
             WHERE f.uitype = 'phone' ORDER BY m.name, f.name;"

          echo "--- is the country field really gone ---"
          psql "$PROD_DATABASE_URL" -P pager=off -tAc "
            SELECT 'field rows: '   || (SELECT count(*) FROM ipy_field WHERE name = 'country_code')
              || ' | column: '      || (SELECT count(*) FROM information_schema.columns
                                         WHERE table_name = 'ipy_e_leads' AND column_name = 'country_code')
              || ' | dropdown: '    || (SELECT count(*) FROM ipy_picklist WHERE name = 'country_code')
              || ' | tombstoned: '  || (SELECT count(*) FROM ipy_field_tombstone WHERE field_name = 'country_code');"

          echo "--- what a new record starts as ---"
          psql "$PROD_DATABASE_URL" -P pager=off -c "
            SELECT p.name AS dropdown, v.value AS starts_as
              FROM ipy_picklist_value v JOIN ipy_picklist p ON p.id = v.picklist_id
             WHERE v.is_default ORDER BY p.name;"

          echo "--- sections, and which ones the admin has claimed ---"
          psql "$PROD_DATABASE_URL" -P pager=off -c "
            SELECT m.name AS module, b.name, b.label, b.is_customised,
                   (SELECT count(*) FROM ipy_field f WHERE f.block_id = b.id) AS fields
              FROM ipy_block b JOIN ipy_module m ON m.id = b.module_id
             ORDER BY m.name, b.sequence;"

          echo "--- admin edits that must have survived the deploy ---"
          psql "$PROD_DATABASE_URL" -P pager=off -tAc "
            SELECT 'fields the admin has edited: ' || count(*) FROM ipy_field WHERE is_customised;"
          psql "$PROD_DATABASE_URL" -P pager=off -tAc "
            SELECT 'layouts the admin has edited: ' || count(*) FROM ipy_layout WHERE is_customised;"
          psql "$PROD_DATABASE_URL" -P pager=off -tAc "
            SELECT 'leads: ' || (SELECT count(*) FROM ipy_record WHERE module_name = 'leads' AND NOT is_deleted)
              || ' | properties: ' || (SELECT count(*) FROM ipy_record WHERE module_name = 'properties' AND NOT is_deleted)
              || ' | mobiles still stored: ' || (SELECT count(*) FROM ipy_e_leads WHERE mobile IS NOT NULL);"

          # Can the team find a lead by its phone number? For a long time the
          # answer was no for everybody, including the lead's own owner, because
          # no phone field was flagged searchable and nothing reached the index.
          # Reported as a permissions problem; it was not one. Migration 098
          # backfilled it, and this is the line that says whether it held.
          echo "--- can a lead be found by its number ---"
          psql "$PROD_DATABASE_URL" -P pager=off -tAc "
            SELECT 'leads with a mobile: ' || count(*)
              || ' | findable by that number: '
              || count(*) FILTER (
                   WHERE position(regexp_replace(e.mobile, '\\D', '', 'g') in r.search_text) > 0)
              FROM ipy_record r JOIN ipy_e_leads e ON e.record_id = r.id
             WHERE NOT r.is_deleted AND e.mobile IS NOT NULL;"
