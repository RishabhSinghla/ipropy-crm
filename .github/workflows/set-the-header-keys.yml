# Set the record header's five facts, and rename Unit Number to "House No.".
#
# **BOTH JOBS WERE ALREADY DONE BY THE TIME THIS RAN, AND ITS FIRST VERSION
# WOULD HAVE DESTROYED THE CONFIGURATION IT FOUND.** Read this before using it.
#
# The owner's prototype of 26 September named five facts for a record's header
# and called the unit field "House No.". Neither is code: the header list is
# `ui.split_view` and the name is `ipy_field.label`, both of which an admin
# sets in the CRM. He asked for them to be set for him, and production is not
# reachable from a development container, so this does what those two screens
# do.
#
# A dry run on 26 September found that somebody had already done both — the
# labels read "House No." with `is_customised` set, and `ui.split_view` held a
# fuller arrangement than the prototype named: seven header fields per module
# plus `queue` and `form` lists somebody had chosen field by field. His own
# message that day listed "Mobile, House No., Portion, Next Follow Up, Lost
# Reason", which is that live arrangement rather than the prototype's five —
# he was describing what he already had.
#
# So this now **merges** rather than replaces: it writes only the `header`
# list for a module named in `modules`, and leaves `queue`, `form` and every
# other module exactly as it finds them. The first version passed a whole
# object and would have emptied all of it — a settings row is a person's work,
# and a job that overwrites one wholesale has no way to tell a value nobody
# chose from a value somebody spent an afternoon on.
#
# Dry run by default: it prints what is there and what it would write, and
# changes nothing. `apply: true` writes.
#
# Two things it must get right, and both have bitten this repo before:
#
#   * A renamed label needs `is_customised = true`, or the seed puts the
#     template's word back on the next cold start. `PUT /api/meta/fields/:id`
#     sets it for exactly that reason.
#   * Both caches are per process. `uiSettings()` memoises for the life of the
#     container and the metadata registry is read on nearly every request, so
#     a direct write is invisible until the container restarts — which reads
#     exactly like the setting not working. The last step says so; run
#     "Deploy now" after this, or wait for the next deploy.
#
# Nothing here touches a record.
name: Set the header keys

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write it (unticked = show what would change, change nothing)"
        type: boolean
        default: false
      leads_header:
        description: "Contacts header fields, comma separated. Blank = leave Contacts alone."
        default: ""
      properties_header:
        description: "Inventory header fields, comma separated. Blank = leave Inventory alone."
        default: ""
      rename_unit_field:
        description: "Also rename the unit field's label to \"House No.\""
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install psql 18
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18

      - name: Set them
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          LEADS_HEADER: ${{ inputs.leads_header }}
          PROPERTIES_HEADER: ${{ inputs.properties_header }}
          RENAME_UNIT_FIELD: ${{ inputs.rename_unit_field }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "No PROD_DATABASE_URL secret configured." >&2
            exit 1
          fi

          echo "=== ui.split_view as it stands ==="
          psql "$PROD_DATABASE_URL" -tAc \
            "SELECT coalesce((SELECT jsonb_pretty(value) FROM ipy_setting WHERE key = 'ui.split_view'), '(no row)');"
          echo
          echo "=== the unit field's name as it stands ==="
          psql "$PROD_DATABASE_URL" -P pager=off -c "
            SELECT m.name AS module, f.name, f.label, f.is_customised
              FROM ipy_field f JOIN ipy_module m ON m.id = f.module_id
             WHERE (m.name = 'leads' AND f.name = 'unit_no')
                OR (m.name = 'properties' AND f.name = 'unit_number');"

          # Only the modules actually named are touched. Everything else in the
          # row — the other module, and this one's own `queue` and `form` —
          # is left exactly as found: a settings row is somebody's work, and a
          # job that rewrites one wholesale cannot tell a value nobody chose
          # from a value somebody spent an afternoon on.
          changed=0
          for spec in "leads:$LEADS_HEADER" "properties:$PROPERTIES_HEADER"; do
            module="${spec%%:*}"
            raw="${spec#*:}"
            [ -z "$raw" ] && { echo "$module: no header given, leaving it alone."; continue; }
            changed=1

            # Comma separated in, a JSON array out, so a typo cannot become SQL.
            fields=$(printf '%s' "$raw" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' \
              | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
            echo
            echo "=== $module header would become: $fields"

            # A header naming a field that is not there shows nothing, silently,
            # which reads as the setting being broken. Checked before writing.
            missing=$(psql "$PROD_DATABASE_URL" -tAc "
              SELECT count(*) FROM jsonb_array_elements_text('$fields'::jsonb) AS want(n)
               WHERE NOT EXISTS (
                 SELECT 1 FROM ipy_field f JOIN ipy_module mo ON mo.id = f.module_id
                  WHERE mo.name = '$module' AND f.name = want.n AND f.is_active);")
            if [ "$missing" != "0" ]; then
              echo "$missing of those fields are missing or hidden on $module. Not writing." >&2
              exit 1
            fi

            if [ "$APPLY" = "true" ]; then
              # jsonb_set with create_if_missing: the module's own `header` key
              # and nothing else. `||` on the whole object would drop the rest.
              psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "
                INSERT INTO ipy_setting (key, value, category)
                VALUES ('ui.split_view',
                        jsonb_build_object('$module', jsonb_build_object(
                          'queue', '[]'::jsonb, 'header', '$fields'::jsonb, 'form', '[]'::jsonb)),
                        'ui')
                ON CONFLICT (key) DO UPDATE SET
                  value = jsonb_set(
                    CASE WHEN jsonb_typeof(ipy_setting.value) = 'object'
                         THEN ipy_setting.value ELSE '{}'::jsonb END
                      || CASE WHEN (CASE WHEN jsonb_typeof(ipy_setting.value) = 'object'
                                         THEN ipy_setting.value ELSE '{}'::jsonb END) ? '$module'
                              THEN '{}'::jsonb
                              ELSE jsonb_build_object('$module', jsonb_build_object(
                                     'queue', '[]'::jsonb, 'header', '[]'::jsonb, 'form', '[]'::jsonb))
                         END,
                    '{$module,header}', '$fields'::jsonb, true),
                  category = 'ui';"
              echo "$module: written."
            fi
          done

          if [ "$RENAME_UNIT_FIELD" = "true" ]; then
            changed=1
            echo
            echo "=== the unit field would be renamed to \"House No.\" ==="
            if [ "$APPLY" = "true" ]; then
              # `is_customised` claims the field as admin-owned, or `db:seed`
              # puts "Unit Number" back on the next cold start.
              psql "$PROD_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "
                UPDATE ipy_field f
                   SET label = 'House No.', is_customised = true, updated_at = now()
                  FROM ipy_module m
                 WHERE m.id = f.module_id
                   AND ((m.name = 'leads' AND f.name = 'unit_no')
                     OR (m.name = 'properties' AND f.name = 'unit_number'))
                   AND f.label IS DISTINCT FROM 'House No.';"
              echo "renamed."
            fi
          fi

          if [ "$changed" = "0" ]; then
            echo
            echo "Nothing was asked for. Give a header list, or tick the rename."
            exit 0
          fi

          if [ "$APPLY" != "true" ]; then
            echo
            echo "Dry run. Nothing was written. Tick 'Write it' to apply."
            exit 0
          fi

          echo
          echo "=== after ==="
          psql "$PROD_DATABASE_URL" -tAc \
            "SELECT jsonb_pretty(value) FROM ipy_setting WHERE key = 'ui.split_view';"
          echo
          echo "Written. Both caches live for the life of the container, so run"
          echo "the 'Deploy now' workflow to restart it — until then the CRM is"
          echo "still serving the old header and the old name."
