# Mint an API key on production for a server-to-server integration.
#
# The normal way is Settings in the app, which needs a browser session. This
# exists because the automation server has to be given a key without anybody
# being at a keyboard, and the production database credentials live here rather
# than on a laptop.
#
# The key is written into a repository secret and NEVER printed. It is bound to
# an existing user, so it inherits that user's permissions and can be revoked on
# its own.
#
# It used to `echo` the key into the job log. **This repository is public**, and
# so are its Actions logs — so the run on 18 August 2026 published a working
# production API key to the internet, where it sat for weeks. A key carries its
# user's permissions: it can read every contact and property in the CRM and
# create and update records. It cannot delete and cannot reach the admin
# routes (`blockApiKey` in `middleware/auth.ts`), which is the only reason this
# was not worse.
#
# `probe-prod-schema.yml` had this right all along — it prints counts and never
# a value, "because this log is public". The same sentence needed to be true
# here and was not.
name: Create API key
on:
  workflow_dispatch:
    inputs:
      name:
        description: "What the key is for, e.g. 'n8n media pipeline'"
        required: true
      user_email:
        description: "Bind it to this user"
        required: true
        default: "rishabhsinghla2112@gmail.com"
      secret_name:
        description: "Repository secret to write the key into, e.g. N8N_IPROPY_API_KEY"
        required: true

permissions:
  # `gh secret set` writes a repository secret; nothing here reads one back.
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: Mint it
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          KEY_NAME: ${{ inputs.name }}
          USER_EMAIL: ${{ inputs.user_email }}
          SECRET_NAME: ${{ inputs.secret_name }}
          GH_TOKEN: ${{ secrets.SECRET_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          npm i --silent --no-save bcryptjs@2 >/dev/null 2>&1

          # Written to files, never eval'd: a bcrypt hash starts with $2b$12$
          # and a shell expands those as variables the moment it sees them.
          node -e '
            const crypto = require("crypto");
            const bcrypt = require("bcryptjs");
            const fs = require("fs");
            const raw = "ipy_" + crypto.randomBytes(24).toString("base64url");
            fs.writeFileSync("/tmp/raw", raw);
            fs.writeFileSync("/tmp/hash", bcrypt.hashSync(raw, 12));
            fs.writeFileSync("/tmp/prefix", raw.slice(0, 8));
          '
          RAW="$(cat /tmp/raw)"; HASH="$(cat /tmp/hash)"; PREFIX="$(cat /tmp/prefix)"

          USER_ID="$(psql "$DATABASE_URL" -tAc "SELECT id FROM ipy_user WHERE lower(email) = lower('${USER_EMAIL}') AND is_active = true LIMIT 1")"
          if [ -z "$USER_ID" ]; then
            echo "No active user with that email. Refusing to make an unbound key."
            exit 1
          fi

          # On stdin, not -c: psql does no variable substitution for -c, so
          # :'hash' arrived at the server literally and it complained about the
          # colon. Quoting the values in still beats interpolating a bcrypt
          # hash into a string by hand.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v name="$KEY_NAME" -v prefix="$PREFIX" -v hash="$HASH" -v uid="$USER_ID" <<'SQL'
          INSERT INTO ipy_api_key (name, key_prefix, key_hash, user_id)
          VALUES (:'name', :'prefix', :'hash', :'uid');
          SQL

          # Into a secret, never into the log. `gh secret set` reads the value
          # from stdin, so the key never becomes an argument either — those show
          # up in `ps` and in any command trace.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No SECRET_WRITE_TOKEN configured, and this workflow will not print a key to a public log."
            echo "::error::Add a fine-grained PAT with 'Secrets: read and write' as the SECRET_WRITE_TOKEN secret, then run this again."
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v prefix="$PREFIX" <<'SQL'
          DELETE FROM ipy_api_key WHERE key_prefix = :'prefix';
          SQL
            echo "::notice::The half-made key was removed again, so nothing is left behind."
            rm -f /tmp/raw /tmp/hash /tmp/prefix
            exit 1
          fi

          printf '%s' "$RAW" | gh secret set "$SECRET_NAME" --repo "$GITHUB_REPOSITORY" --body -

          # The prefix is not a secret: it is stored in the clear in
          # `ipy_api_key` so a key can be identified and revoked by name.
          echo "::notice::Key created for ${USER_EMAIL} and written to the ${SECRET_NAME} secret. Prefix ${PREFIX}."
          rm -f /tmp/raw /tmp/hash /tmp/prefix
