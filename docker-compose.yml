services:
  db:
    image: postgres:16-alpine
    container_name: ipropy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipropy
      POSTGRES_PASSWORD: ipropy
      POSTGRES_DB: ipropy
    ports:
      - "5432:5432"
    volumes:
      - ipropy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipropy -d ipropy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ipropy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ipropy_redisdata:/data

volumes:
  ipropy_pgdata:
  ipropy_redisdata:
