services:
  db:
    # Matches the deployed database's major version. Neon is on 18, and a
    # mismatch is not cosmetic: pg_dump refuses to read a server newer than
    # itself, so `db:pull-prod` cannot copy production onto a local 16 at all.
    # Changing this major version makes the existing data directory unreadable
    # — the volume has to be recreated, which is why the script backs up local
    # before it does anything.
    # pgvector rather than plain Postgres, because production has it and
    # semantic search is a real column type rather than a library call. Neon
    # ships pgvector 0.8.6; this is the closest local equivalent, and a local
    # database that cannot hold a vector fails the migration on boot rather
    # than quietly running a CRM with search switched off.
    image: pgvector/pgvector:pg18
    container_name: ipropy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipropy
      POSTGRES_PASSWORD: ipropy
      POSTGRES_DB: ipropy
    ports:
      - "5432:5432"
    volumes:
      # 18+ images store data in a major-version-specific subdirectory, so the
      # mount is the parent now. Mounting /var/lib/postgresql/data as before
      # makes the image refuse to start: it finds data at a path it no longer
      # uses and stops rather than silently ignoring it.
      - ipropy_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipropy -d ipropy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Containerised app + worker. Behind the `app` profile so local dev
  # (`docker compose up -d db`) is unaffected — bring the full stack up with
  # `docker compose --profile app up -d --build`.
  app:
    image: ipropy-crm:latest
    build:
      context: .
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      SERVE_WEB: "true"
      ENABLE_SCHEDULER: "false"
      # Inside the compose network Postgres is reachable by service name.
      DATABASE_URL: postgres://ipropy:ipropy@db:5432/ipropy
    ports:
      - "4000:4000"
    volumes:
      - ipropy_storage:/app/storage

  worker:
    image: ipropy-crm:latest
    build:
      context: .
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULER: "true"
      DATABASE_URL: postgres://ipropy:ipropy@db:5432/ipropy
    volumes:
      # Media jobs (core/media/pipeline.ts) run on this container and need to
      # read/write the same local-disk attachments the app container uploads
      # to — without this, background processing silently can't touch them.
      - ipropy_storage:/app/storage

volumes:
  ipropy_pgdata:
  ipropy_storage:
