<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + the safe-area padding in styles.css keeps the app
         clear of the iPhone notch and home indicator once installed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="AI-native CRM for Indian real estate." />
    <title>iPropy CRM</title>

    <!-- PWA: installable on Android/Chrome via the manifest… -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><path d='M50 20L78 42v36H60V56H40v22H22V42z' fill='white'/></svg>" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <!-- …and on iOS/iPadOS, which ignores the manifest and needs these instead
         to run full-screen from the home screen with the right icon. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="iPropy" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
